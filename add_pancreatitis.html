<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оценка тяжести панкреатита по Рэнсону</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/pancreatitis_styles.css">
</head>
<body>

<div class="mobile-container">

    <div id="add-page" class="page active">
        <h2 class="page-title">Новая карточка</h2>

        {{ if .Error }}
        <p class="form-error">{{ .Error }}</p>
        {{ end }}

        {{ if .Draft }}
        <form action="/pancreatitis-signs/publish" method="POST">
            <div class="form-group">
                <label class="form-label">Медиафайл (Фото/Видео)</label>
                <div class="media-upload-row">
                    <div class="upload-area">
                        <i class="fa-solid fa-image"></i>
                        <div>Загрузить</div>
                    </div>
                    <div class="upload-area">
                        <i class="fa-solid fa-camera"></i>
                        <div>Загрузить</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Тема / Критерий</label>
                <input type="text" name="title" class="form-input" value="{{ .Draft.Title }}" maxlength="100" required>
            </div>

            <div class="form-group">
                <label class="form-label">Описание критерия</label>
                <textarea name="description" class="form-textarea" maxlength="500" required>{{ .Draft.Description }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Этап оценки</label>
                <input type="text" name="stage" class="form-input" value="{{ .Draft.Stage }}" placeholder="При поступлении / Через 48 часов" maxlength="30" required>
            </div>

            <div class="form-group">
                <label class="form-label">Пороговое значение</label>
                <input type="number" name="threshold_value" class="form-input" value="{{ if ne .Draft.ThresholdValue 0.0 }}{{ .Draft.ThresholdValue }}{{ end }}" step="any" required>
            </div>

            <button type="submit" class="submit-btn">Опубликовать</button>
        </form>
        {{ else }}
        <form action="/pancreatitis-signs/create" method="POST">
            <div class="form-group">
                <label class="form-label">Медиафайл (Фото/Видео)</label>
                <div class="media-upload-row">
                    <div class="upload-area">
                        <i class="fa-solid fa-image"></i>
                        <div>Загрузить</div>
                    </div>
                    <div class="upload-area">
                        <i class="fa-solid fa-camera"></i>
                        <div>Загрузить</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Тема / Критерий</label>
                <input type="text" name="title" class="form-input" maxlength="100" required>
            </div>

            <button type="submit" class="submit-btn">Далее</button>
        </form>
        {{ end }}
    </div>

    <div class="bottom-nav">
        <a href="/pancreatitis-signs/feed" class="nav-item" style="text-decoration: none;">
            <i class="fa-solid fa-house"></i>
            <span>Лента</span>
        </a>
        <a href="/pancreatitis-signs/add" class="nav-item active" style="text-decoration: none;">
            <i class="fa-regular fa-square-plus"></i>
            <span>Добавить</span>
        </a>
        <a href="/pancreatitis-signs/grid" class="nav-item" style="text-decoration: none;">
            <i class="fa-solid fa-border-all"></i>
            <span>Плитка</span>
        </a>
    </div>

</div>
</body>
</html>
